<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <title>quinielas</title>
    <script>
        var path = window.location.pathname;
        if (path.includes('/quinielaselmorro')) {
            document.write('<base href="/quinielaselmorro/" />');
        } else {
            document.write('<base href="/" />');
        }
    </script>

    <script type="text/javascript">
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location));
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="quinielas.styles.css" />
    <link rel="icon" type="image/png" href="./balon_logo_trans.png" />
</head>

<body>
    <div id="app">
        <div class="loading-progress-text">Cargando...</div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error no controlado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
